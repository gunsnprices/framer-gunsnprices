name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      # type-check and unit tests
      - run: npm run check
      # build and dist/plugin.zip
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist/plugin.zip
